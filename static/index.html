<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LEO Copilot Pro</title>
  <link rel="stylesheet" href="/static/style2.css">
</head>
<body>
  <div class="app">
    <header>
      <button id="menuBtn" class="icon-btn">☰</button>
      <div class="title-block">
        <h1>
          <span class="pro-badge">PRO</span>
          LEO Copilot
          <span class="lion-logo">🦁</span>
        </h1>
        <p id="chatTitle">مساعدك الذكي الشامل</p>
      </div>
    </header>

    <div class="sidebar">
      <div class="sidebar-header">
        <button id="closeSidebarBtn" class="icon-btn">✕</button>
        <input type="text" id="searchInput" class="sidebar-search" placeholder="بحث في المحادثات...">
      </div>
      <div class="sidebar-list" id="chatList"></div>
      <div class="sidebar-footer">
        <button class="btn-primary full" id="newChatBtn">+ محادثة جديدة</button>
        <button class="btn-ghost full" id="statsBtn">📊 الإحصائيات</button>
        <button class="btn-ghost full" id="settingsBtn">⚙️ الإعدادات</button>
        <button class="btn-danger full" id="clearAllBtn">🗑️ مسح الكل</button>
        <div class="dev-credit">
          <div class="dev-name">Developed by <strong>Mohamed Hassan Taha</strong></div>
          <div class="dev-links">
            <a href="https://github.com/oneshoot5010" target="_blank" rel="noopener">GitHub</a>
            <span>•</span>
            <a href="https://wa.me/201044947639" target="_blank" rel="noopener">WhatsApp</a>
          </div>
        </div>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
      <button id="voiceInput" class="icon-btn" title="رسالة صوتية">🎤</button>
      <textarea id="input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
      <div class="custom-select" id="modeSelect">
        <button class="mode-btn" id="modeBtn" type="button">
          <span id="modeLabel">عام</span> <span class="chevron">▾</span>
        </button>
        <div class="mode-dropdown" id="modeDropdown">
          <div class="mode-option active" data-value="general">عام</div>
          <div class="mode-option" data-value="explain">شرح</div>
          <div class="mode-option" data-value="code">برمجة</div>
          <div class="mode-option" data-value="detailed">مفصل</div>
          <div class="mode-option" data-value="creative">إبداعي</div>
        </div>
      </div>
      <button id="send" class="btn-send">➤</button>
      <button id="speakOutput" class="icon-btn" title="استماع الرد">🔊</button>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal" id="settingsModal">
    <div class="modal-box">
      <h2>الإعدادات</h2>
      <div class="setting-row">
        <label>Dark Mode</label>
        <label class="switch">
          <input type="checkbox" id="darkMode">
          <span class="slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <label>حجم الخط</label>
        <div class="font-controls">
          <button id="fontSmaller">−</button>
          <span id="fontSize">14px</span>
          <button id="fontLarger">+</button>
        </div>
      </div>
      <div class="setting-row">
        <label>سرعة الكلام</label>
        <select id="speechRate">
          <option value="0.5">بطيء</option>
          <option value="1" selected>عادي</option>
          <option value="1.5">سريع</option>
        </select>
      </div>
      <div class="setting-row">
        <label>نوع الصوت</label>
        <select id="voiceType">
          <option value="ar">عربي</option>
          <option value="en">إنجليزي</option>
        </select>
      </div>
      <button class="btn-primary full" id="closeSettings">إغلاق</button>
    </div>
  </div>

  <div class="modal" id="statsModal">
    <div class="modal-box">
      <h2>إحصائيات المحادثات</h2>
      <div id="statsContent"></div>
      <button class="btn-primary full" id="closeStats">إغلاق</button>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
