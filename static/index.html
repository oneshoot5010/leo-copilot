<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LEO Copilot Pro</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button id="newChatBtn" class="btn-primary full">+ محادثة جديدة</button>
  </div>

  <div class="sidebar-search">
    <input type="text" id="searchChats" placeholder="بحث في المحادثات...">
  </div>

  <div class="sidebar-list" id="chatList"></div>

  <div class="sidebar-footer">
    <button id="exportBtn" class="btn-ghost full">⬇ تصدير كل المحادثات</button>
    <button id="deleteAllBtn" class="btn-danger full">🗑 حذف الكل</button>
    <button id="settingsBtn" class="btn-ghost full">⚙ الإعدادات</button>

    <div class="dev-credit">
      <div class="dev-name">Developed by <strong>Mohamed Hassan Taha</strong></div>
      <div class="dev-links">
        <a href="https://github.com/oneshoot5010" target="_blank" rel="noopener">GitHub</a>
        <span>•</span>
        <a href="https://wa.me/201044947639" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </div>
</aside>

<div class="app">
  <header>
    <button id="menuBtn" class="icon-btn">☰</button>
    <div class="title-block">
      <h1><span class="lion-logo">🦁</span> LEO Copilot <span class="pro-badge">PRO</span></h1>
      <p id="chatTitle">مساعدك الذكي الشامل</p>
    </div>
    <button id="langBtn" class="icon-btn lang-btn" title="لغة الرد">AR</button>
    <div class="mode-select" id="modeSelect">
      <button type="button" id="modeBtn" class="mode-btn">📌 عام</button>
      <ul id="modeMenu" class="mode-menu">
        <li data-value="general">📌 عام</li>
        <li data-value="code">💻 برمجة</li>
        <li data-value="explain">📚 شرح</li>
        <li data-value="detailed">📝 مفصّل</li>
        <li data-value="creative">✨ إبداعي</li>
      </ul>
    </div>
  </header>

  <div id="pinnedBar" class="pinned-bar"></div>

  <div id="chat" class="chat"></div>

  <div class="input-area">
    <button id="micBtn" class="icon-btn mic-btn" title="إدخال صوتي">🎙️</button>
    <textarea id="message" placeholder="اكتب سؤالك أو الصق الكود هنا..." rows="1"></textarea>
    <button id="send">إرسال</button>
  </div>
</div>

<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>🔒 التطبيق مقفول</h2>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="4" placeholder="ادخل الرقم السري">
    <button id="unlockBtn" class="btn-primary full">فتح</button>
    <p class="lock-error" id="lockError"></p>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>⚙ الإعدادات</h2>

    <div class="setting-row">
      <span>حجم الخط</span>
      <div class="font-controls">
        <button id="fontMinus">A-</button>
        <span id="fontValue">14</span>
        <button id="fontPlus">A+</button>
      </div>
    </div>

    <div class="setting-row">
      <span>الوضع الليلي دائمًا</span>
      <label class="switch">
        <input type="checkbox" id="darkToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row">
      <span>قراءة الردود بصوت عالٍ تلقائيًا</span>
      <label class="switch">
        <input type="checkbox" id="ttsToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-block">
      <span>إحصائيات الاستخدام</span>
      <div id="statsBox" class="stats-box"></div>
    </div>

    <div class="setting-block">
      <span>قفل التطبيق برقم سري (4 أرقام)</span>
      <div class="pin-controls">
        <input type="password" id="pinSetupInput" inputmode="numeric" maxlength="4" placeholder="ارقام">
        <button id="setPinBtn" class="btn-ghost">تفعيل</button>
        <button id="removePinBtn" class="btn-danger">إلغاء</button>
      </div>
    </div>

    <button id="closeSettings" class="btn-primary full">تم</button>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
